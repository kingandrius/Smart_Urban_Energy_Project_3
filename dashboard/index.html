<!DOCTYPE html>
<html lang="en">
<head>
    <!-- fix that weird Â symbol once and for all -->
    <meta charset="UTF-8">
    <title>Energy Dashboard</title>

    <!-- load chart.js from the web so we can make graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* keeping it dark mode and clean */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: white;
            text-align: center;
            padding-bottom: 50px;
        }

        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 50px;
            border: 1px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            min-width: 300px;
        }

        .chart-container {
            width: 80%;
            max-width: 700px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        h1 { color: #00ffcc; margin-bottom: 20px; }
        p { font-size: 1.5rem; margin: 10px 0; font-weight: bold; }
        .label { color: #888; font-size: 0.9rem; text-transform: uppercase; font-weight: normal; }
    </style>
</head>
<body>

    <!-- the weather readout card -->
    <div class="card">
        <h1>Eindhoven Weather</h1>
        <div>
            <p class="label">Temperature</p>
            <p id="temp">--</p>
        </div>
        <div>
            <p class="label">Wind Speed</p>
            <p id="wind">--</p>
        </div>
        <div>
            <p class="label">Conditions</p>
            <p id="status">--</p>
        </div>
    </div>

    <!-- the container for our chart -->
    <div class="chart-container">
        <canvas id="weatherChart"></canvas>
    </div>

    <!-- finally, load our logic -->
    <script src="script.js"></script>
</body>
</html>
