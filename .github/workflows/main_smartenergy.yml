name: Build and deploy Node.js app to Azure Web App - SmartEnergy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4 # Updated to v4 to remove warnings
        with:
          node-version: '20.x' # Node 24 is very new; 20 is the current long-term stable (LTS)

      - name: npm install, build, and test
        working-directory: ./data_relay
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: data_relay # This uploads everything INSIDE data_relay

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: . # Download contents directly into the root of the runner

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C808380C3A4D4979AD44037551CB40B2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8786444EFD964D7A91F70518DD4A77FC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9FB51F41A7E948FA913E2F58E4C91F86 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SmartEnergy'
          slot-name: 'Production'
          package: . # Deploy from the root because the artifact was the data_relay folder content